# Thème natif M3 « Eau & Biodiversité » (tâche 4).
#
# Base du look ; le polissage Material 3 Expressive (dégradés, cartes, badges de
# section) vit dans styles.css, injecté par app.load_css. secrets.toml reste le
# seul fichier .streamlit ignoré par git.
#
# Police : « sans-serif » (pile système) et non Roboto — charger Roboto
# demanderait un [[theme.fontFaces]] externe, fragile pour une application
# cliente. Ajout possible en quelques lignes si besoin.

[theme]
base = "light"
primaryColor = "#009688"            # teal vif — accent principal
backgroundColor = "#F4FBF9"         # surface, très légèrement teintée
secondaryBackgroundColor = "#E2F1ED"  # cartes, widgets, sidebar : teinte, pas gris
textColor = "#10302C"               # encre sombre, fort contraste
linkColor = "#00796B"
borderColor = "#A7D3CB"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "large"                # coins généreux (M3 Expressive)
buttonRadius = "full"               # boutons pilule
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#C5E7DF"
dataframeBorderColor = "#A7D3CB"

[theme.dark]
primaryColor = "#4DB6AC"
backgroundColor = "#0E1918"
secondaryBackgroundColor = "#172622"
textColor = "#E4F3EF"
linkColor = "#80CBC4"
borderColor = "#2F4A44"
dataframeHeaderBackgroundColor = "#1E2E2A"
dataframeBorderColor = "#2F4A44"
